name: Web staging E2E

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: e2e
    env:
      NODE_ENV: staging
      CSP_MODE: enforce
      GLOSSARY_SAMPLE_SEED: '42'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Unit tests
        run: pnpm test
      - name: Mask target host in logs
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          node -e 'const u = new URL(process.env.E2E_BASE_URL); console.log(`::add-mask::${u.hostname}`); console.log(`::add-mask::${u.origin}`)'
      - name: Staging E2E checks
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: pnpm run e2e:staging

  lighthouse:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: e2e
    env:
      NODE_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Mask target host in logs
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          node -e 'const u = new URL(process.env.E2E_BASE_URL); console.log(`::add-mask::${u.hostname}`); console.log(`::add-mask::${u.origin}`)'
      - name: Lighthouse staging audit
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: pnpm run e2e:lhci
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-staging
          path: e2e/ci-artifacts/lighthouse/
          if-no-files-found: ignore
