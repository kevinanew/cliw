name: 首页视觉基准验证

on:
  push:
    branches: [temp/laiwan-home-visual-generator]

permissions:
  contents: read

jobs:
  visual:
    if: github.repository == 'kevinanew/cliw' && github.actor == 'kevinanew'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    defaults:
      run:
        working-directory: visual
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      VISUAL_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      VISUAL_LOCALES: all
      VISUAL_VIEWPORTS: all
      VISUAL_WORKERS: '4'
      VISUAL_RETRIES: '0'
      VISUAL_FILTER: '_homepage|_home_entrance|首页装饰保持静止|按钮扫光与悬停复位|iOS 加载与弹窗|小屋内的应用预览渐显|只有宽屏前景牌桌响应鼠标|路由进度条与圆环|汉堡按钮开合|减少动态效果'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 确认 staging 为已审核的首页版本
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.VISUAL_BASE_URL);
          console.log('::add-mask::' + url.origin);
          console.log('::add-mask::' + url.hostname);
          const response = await fetch(url);
          const html = await response.text();
          if (!response.ok || !html.includes('staging - 1b66065 - ')) {
            throw new Error('staging 版本已变化，停止生成首页基准');
          }
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:animation
      - name: 生成受改版影响的画面
        run: pnpm run approve:ci
      - name: 用生成的画面重新比较
        run: pnpm run test:ci
      - name: 保存待人工审阅的基准
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add -- snapshots
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m '测试: 为已确认的首页设计生成候选视觉基准'
          git push origin HEAD:refs/heads/temp/laiwan-home-visual-generator
