name: 三语视觉复验

on:
  push:
    branches: [temp/laiwan-home-visual-verify]

permissions:
  contents: read

jobs:
  visual:
    if: github.repository == 'kevinanew/cliw' && github.actor == 'kevinanew'
    name: Visual (${{ matrix.locale }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        locale: [zh, zh-TW, en]
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    defaults:
      run:
        working-directory: visual
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      VISUAL_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      VISUAL_LOCALES: ${{ matrix.locale }}
      VISUAL_VIEWPORTS: desktop,small-desktop,mobile,pixel-9
      VISUAL_WORKERS: '4'
      VISUAL_RETRIES: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 确认 staging 为已审核的首页版本
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.VISUAL_BASE_URL);
          console.log('::add-mask::' + url.origin);
          console.log('::add-mask::' + url.hostname);
          const response = await fetch(url);
          const html = await response.text();
          if (!response.ok || !html.includes('staging - 1b66065 - ')) {
            throw new Error('staging 版本已变化，停止使用旧版已知回归分组');
          }
          NODE
      - run: pnpm install --frozen-lockfile
      - name: 检查视觉场景
        run: pnpm run typecheck:animation && pnpm run test:scenarios && pnpm run test:flake-metrics
      - name: 运行现网其他视觉与功能断言
        run: pnpm exec playwright test --grep-invert '安卓下载按钮在索引加载前后'
      - name: 核实已知回归仍由专用断言捕获
        if: always()
        run: pnpm exec playwright test --grep '安卓下载按钮在索引加载前后'
