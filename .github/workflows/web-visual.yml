name: Web visual regression

on:
  push:
    branches: [master]
    paths:
      - 'visual/**'
      - '.github/workflows/web-visual.yml'
  pull_request:
    branches: [master]
    paths:
      - 'visual/**'
      - '.github/workflows/web-visual.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *'

permissions:
  contents: read

jobs:
  visual:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Visual (${{ matrix.locale }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        locale: [zh, zh-TW, en]
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    defaults:
      run:
        working-directory: visual
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      VISUAL_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      VISUAL_LOCALES: ${{ matrix.locale }}
      VISUAL_VIEWPORTS: desktop,small-desktop,mobile,pixel-9
      VISUAL_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: visual/pnpm-lock.yaml
      - name: Mask target host in logs
        run: |
          node -e 'const u = new URL(process.env.VISUAL_BASE_URL); console.log(`::add-mask::${u.hostname}`); console.log(`::add-mask::${u.origin}`)'
      - run: pnpm install --frozen-lockfile
      - name: Check visual scenarios
        run: pnpm run test:scenarios && pnpm run test:flake-metrics
      - name: Compare screenshots
        run: pnpm run test:ci
      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ matrix.locale }}
          path: |
            visual/playwright-report/
            visual/test-results/
            visual/visual-retry-metrics.json
          if-no-files-found: ignore
          retention-days: 7
