name: Web visual regression

on:
  push:
    branches: [main, master]
    paths:
      - 'visual/**'
      - '.github/workflows/web-visual.yml'
  pull_request:
    paths:
      - 'visual/**'
      - '.github/workflows/web-visual.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Visual matrix to check'
        type: choice
        options: [rotation, all]
        default: rotation
  schedule:
    - cron: '43 3 * * *'
    - cron: '11 4 * * 0'

permissions:
  contents: read

jobs:
  visual:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    defaults:
      run:
        working-directory: visual
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      VISUAL_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      VISUAL_WORKERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: visual/pnpm-lock.yaml
      - name: Mask target host in logs
        run: |
          node -e 'const u = new URL(process.env.VISUAL_BASE_URL); console.log(`::add-mask::${u.hostname}`); console.log(`::add-mask::${u.origin}`)'
      - run: pnpm install --frozen-lockfile
      - name: Check visual scenarios
        run: pnpm run test:scenarios && pnpm run test:flake-metrics
      - name: Select visual matrix
        env:
          VISUAL_SCOPE: ${{ inputs.scope }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [ "$VISUAL_SCOPE" = all ] || [ "$CRON_EXPRESSION" = '11 4 * * 0' ]; then
            echo 'VISUAL_LOCALES=all' >> "$GITHUB_ENV"
            echo 'VISUAL_VIEWPORTS=desktop,small-desktop,mobile,pixel-9' >> "$GITHUB_ENV"
          else
            eval "$(node visual-rotation.js "$GITHUB_RUN_NUMBER")"
            echo "VISUAL_LOCALES=$VISUAL_LOCALES" >> "$GITHUB_ENV"
            echo "VISUAL_VIEWPORTS=$VISUAL_VIEWPORTS" >> "$GITHUB_ENV"
          fi
      - name: Compare screenshots
        run: pnpm run test:ci
      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: |
            visual/playwright-report/
            visual/test-results/
            visual/visual-retry-metrics.json
          if-no-files-found: ignore
          retention-days: 7
