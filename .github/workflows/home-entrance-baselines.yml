name: Prepare home entrance baselines

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/home-entrance-baselines.yml

permissions:
  contents: read

jobs:
  reference:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    defaults:
      run:
        working-directory: visual
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      VISUAL_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      VISUAL_LOCALES: all
      VISUAL_VIEWPORTS: desktop,mobile
      VISUAL_FILTER: home_entrance
      VISUAL_WORKERS: '2'
      VISUAL_RETRIES: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: visual/pnpm-lock.yaml
      - name: 隐藏测试站点地址
        run: |
          node -e 'const u = new URL(process.env.VISUAL_BASE_URL); console.log(`::add-mask::${u.hostname}`); console.log(`::add-mask::${u.origin}`)'
      - run: pnpm install --frozen-lockfile
      - name: 生成待人工审查的动画基准
        run: |
          node <<'NODE'
          const { spawn } = require('node:child_process');
          const { readFileSync } = require('node:fs');
          const started = Date.now();
          let peak = 0;
          const sample = setInterval(() => {
            try { peak = Math.max(peak, Number(readFileSync('/sys/fs/cgroup/memory.current', 'utf8'))); } catch {}
          }, 100);
          const child = spawn('pnpm', ['run', 'reference:ci'], { stdio: 'inherit' });
          child.on('exit', (code) => {
            clearInterval(sample);
            console.log(`动画场景耗时 ${(Date.now() - started) / 1000}s，容器内存采样峰值 ${(peak / 1024 / 1024).toFixed(1)}MiB`);
            process.exitCode = code ?? 1;
          });
          NODE
      - name: 重复比较已生成基准
        run: pnpm run test:ci
      - uses: actions/upload-artifact@v4
        with:
          name: home-entrance-baselines
          path: visual/snapshots/*home-entrance-*.png
          if-no-files-found: error
          retention-days: 7
